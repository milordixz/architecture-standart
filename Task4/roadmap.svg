<text x="100" y="80" class="title">RoadMap: передача депозитных ставок в кол-центры</text>
<text x="100" y="125" class="subtitle">MVP на 6 месяцев: банковский кол-центр через API, партнёрский кол-центр через SFTP-файл и ACK. Целевой горизонт 1 год: развитие внешнего канала и персональных ставок.</text>
<rect x="360" y="230" width="1640" height="770" fill="#fff2cc"/>

